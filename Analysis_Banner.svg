<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F2027"/>
      <stop offset="0.5" stop-color="#203A43"/>
      <stop offset="1" stop-color="#2C5364"/>
    </linearGradient>
    <style>
      .t{font:700 54px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#fff;opacity:0;animation:f 1.2s ease-out .2s forwards}
      .d{font:500 22px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#36BCF7;letter-spacing:2px;opacity:0;animation:f 1.2s ease-out .7s forwards}
      .w{animation:m 6s ease-in-out infinite alternate}
      @keyframes f{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      @keyframes m{from{transform:translateX(0)}to{transform:translateX(-60px)}}
    </style>
  </defs>
  <path d="M0 0H1200V165C1000 215 800 135 600 165S200 215 0 165Z" fill="url(#g)"/>
  <g class="w"><path d="M0 175C200 225 400 145 600 175S1000 225 1260 175V230H0Z" fill="#36BCF7" opacity="0.12"/></g>
  <text class="t" x="600" y="98" text-anchor="middle">Dikshant Mitrav</text>
  <text class="d" x="600" y="142" text-anchor="middle">PRODUCT MANAGER • DATA &amp; AI</text>
</svg>
