name: Update weather card

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/weather.py
      - name: Commit if changed
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@github.com"
          git add weather.svg
          git diff --cached --quiet || git commit -m "🌦️ Update weather card"
          git push
